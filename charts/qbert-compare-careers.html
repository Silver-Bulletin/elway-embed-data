  :root{--ink:#101214;--muted:#60686e;--hair:#cfd5d9;--paper:#f4f4f1;--green:#04ff40;--headline:"Archivo Narrow","Arial Narrow",Arial,sans-serif;--mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;--sans:"Geist",Arial,Helvetica,sans-serif}

  .qc-toggle input:checked{background:var(--ink)}

  @font-face{font-family:"Geist";src:url("https://static.dwcdn.net/custom/themes/silver-bulletin/Geist-Regular.woff2") format("woff2");font-style:normal;font-weight:400;font-display:swap}

  .qc-layout{display:block;position:relative;border-bottom:1px solid var(--hair)}

function mostWarTeam(d){return WAR_TEAM[d.id]||d.tm||"";}
// Colors are optimized jointly, with team colors preferred.
const RESERVE_COLORS=["#aa0000","#b09200","#0072b2","#202124"];
let paletteKey="",palette=new Map();
const colorMetrics=new Map();
function metrics(color){
  if(colorMetrics.has(color))return colorMetrics.get(color);
  const rgb=d3.rgb(color);
  const linear=[rgb.r,rgb.g,rgb.b].map(v=>{v/=255;return v<=.04045?v/12.92:((v+.055)/1.055)**2.4;});
  const encode=v=>255*(v<=.0031308?12.92*v:1.055*v**(1/2.4)-.055);
  // Full-severity Machado matrices, applied in linear RGB.
  const matrices=[
    [[.152286,1.052583,-.204868],[.114503,.786281,.099216],[-.003882,-.048116,1.051998]],
    [[.367322,.860646,-.227968],[.280085,.672501,.047413],[-.011820,.042940,.968881]],
    [[1.255528,-.076749,-.178779],[-.078411,.930809,.147602],[.004733,.691367,.303900]]
  ];
  const labs=[d3.lab(color),...matrices.map(m=>d3.lab(d3.rgb(...m.map(row=>encode(Math.max(0,Math.min(1,row.reduce((s,v,i)=>s+v*linear[i],0))))))))];
  const contrast=1.05/(.2126*linear[0]+.7152*linear[1]+.0722*linear[2]+.05);
  const [r,g,b]=linear;
  const l=Math.cbrt(.4122214708*r+.5363325363*g+.0514459929*b);
  const m=Math.cbrt(.2119034982*r+.6806995451*g+.1073969566*b);
  const s=Math.cbrt(.0883024619*r+.2817188376*g+.6299787005*b);
  const L=.2104542553*l+.793617785*m-.0040720468*s;
  const A=1.9779984951*l-2.428592205*m+.4505937099*s;
  const B=.0259040371*l+.7827717662*m-.808675766*s;
  const chroma=Math.hypot(A,B),hue=(Math.atan2(B,A)*180/Math.PI+360)%360;
  const result={labs,contrast,L,A,B,chroma,hue};colorMetrics.set(color,result);return result;
}
function separation(a,b){
  const x=metrics(a).labs,y=metrics(b).labs;
  return x.map((p,i)=>Math.hypot(p.l-y[i].l,p.a-y[i].a,p.b-y[i].b));
}
function compatible(a,b){
  const x=metrics(a),y=metrics(b);
  const hueGap=Math.min(Math.abs(x.hue-y.hue),360-Math.abs(x.hue-y.hue));
  // Reject look-alike hue families, even if differing saturation/lightness
  // would let them pass a single distance test. Also reject two near-blacks.
  if(x.chroma>.045&&y.chroma>.045&&hueGap<50)return false;
  if(x.chroma<=.045&&y.chroma<=.045)return false;
  // Darkness alone is not similarity: true black and saturated Bills blue
  // remain separated. Reject dark pairs only when lightness is close too.
  if(x.L<.38&&y.L<.38&&Math.abs(x.L-y.L)<.18)return false;
  // A simulated-vision collision is a disqualification, not just a tiebreak.
  // In particular, Bengals orange and Chiefs gold must not share a chart.
  if(Math.min(...separation(a,b).slice(1))<12)return false;
  return Math.hypot(x.L-y.L,x.A-y.A,x.B-y.B)>=.16;
}
function assignPalette(){
  const key=state.selected.join("|");
  if(key===paletteKey)return;
  const previous=palette;
  const fallback=[...FALLBACK_COLORS,...RESERVE_COLORS];
  const choices=state.selected.map(id=>{
    const team=TEAM_COLORS[mostWarTeam(byId.get(id))]||[];
    return [...new Set([...team,...fallback])]
      .filter(c=>metrics(c).contrast>=3)
      .map(color=>({color,fallback:team.includes(color)?0:1,rank:team.includes(color)?team.indexOf(color):0}));
  });
  let best=null,bestScore=null;
  const less=(a,b)=>{for(let i=0;i<a.length;i++){if(a[i]!==b[i])return a[i]<b[i];}return false;};
  function search(i,chosen,foreign,rank,changes){
    if(bestScore&&foreign>bestScore[0])return;
    if(i===choices.length){
      let gap=200,visionPenalty=0;
      chosen.forEach((c,j)=>chosen.slice(0,j).forEach(p=>{
        const distances=separation(c,p);
        gap=Math.min(gap,distances[0]);
        visionPenalty+=distances.slice(1).reduce((sum,v)=>sum+Math.max(0,12-v)**2,0);
      }));
      // First preserve team identity and existing assignments. Among otherwise
      // equal palettes, prefer fewer simulated-vision conflicts, then separation.
      const score=[foreign,rank,changes,visionPenalty,-gap];
      if(!bestScore||less(score,bestScore)){bestScore=score;best=chosen.slice();}
      return;
    }
    for(const option of choices[i]){
      if(!chosen.every(c=>compatible(c,option.color)))continue;
      chosen.push(option.color);
      search(i+1,chosen,foreign+option.fallback,rank+option.rank,
        changes+(previous.has(state.selected[i])&&previous.get(state.selected[i])!==option.color?1:0));
      chosen.pop();
    }
  }
  search(0,[],0,0,0);
  // This verified four-color reserve always satisfies the same constraints.
  if(!best)best=RESERVE_COLORS.slice(0,state.selected.length);
  palette=new Map(state.selected.map((id,i)=>[id,best[i]]));paletteKey=key;
}
function seriesStyle(id){
  assignPalette();
  return {color:palette.get(id)};
}
function addMarker(g,c,px,py,projection=false){
  return g.append("circle").attr("class",projection?"qc-projection-marker":"qc-peak-marker")
    .attr("cx",px).attr("cy",py).attr("r",projection?4.5:3.8)
    .attr("fill",projection?"#fff":c).attr("stroke",projection?c:"#fff")
    .attr("stroke-width",projection?2:1.2).attr("pointer-events","none");
}
function selectedColors(ids=state.selected){
  assignPalette();
  return new Map(ids.filter(id=>byId.has(id)).map(id=>[id,seriesStyle(id).color]));
}

const fmt1=v=>v.toFixed(1);
function dnum(ymd){return new Date(Math.floor(ymd/10000),Math.floor(ymd/100)%100-1,ymd%100);}
const fmtDate=d3.timeFormat("%b %-d, %Y");
function ageAt(dob,ymd){return (dnum(ymd)-dnum(dob))/(365.2425*86400e3);}
function frac(s,w){return (w-1)/(MAXW[s]||22)*0.92;}

const NOTES={
  calendar:"Note: Offseasons are compressed; vertical rules mark new seasons. Blank spans within a season indicate time without NFL starts.",
  game:"Each start of a career is one step on the x-axis, so eras and layoffs are ignored.",
  season:"Careers are aligned by seasons since debut; blank spans indicate missed time.",
  age:"Careers are aligned by each player's age on game day."
};
const NOTES_TAIL=" Filled dot: career peak. Hollow dot: next-game projection. Per-start values are QBERT posterior ratings, 1950\u20132026.";
const ADJUSTED_NOTES=" Starts include playoffs. Trend: trailing 10 starts, weighted by estimated plays; begins at start 10. No player priors.";

// Only complete windows are shown. Missing ratings/weights are not zero-filled.
// The window is trailing (including this start), never centered on future games.
function adjustedTrend(pts){
  return pts.map((p,k)=>{
    if(k<9)return null;
    const window=pts.slice(k-9,k+1);
    if(window.some(q=>!Number.isFinite(q[AQ])||!Number.isFinite(q[PL])||q[PL]<=0))return null;
    return d3.sum(window,q=>q[AQ]*q[PL])/d3.sum(window,q=>q[PL]);
  });
}
function validStarts(d){return state.metric==="adjusted"?(state.dots?d.pts.some(p=>Number.isFinite(p[AQ])):adjustedTrend(d.pts).some(Number.isFinite)):d.pts.length||d.pj;}

      b.innerHTML=`<span class="qc-team-abbr">${t}</span><span class="qc-team-name">${TEAM_NAMES[t]}</span>`;
      b.addEventListener("click",()=>{state.team=t;state.pickerMode="all";state.search="";searchEl.value="";renderPanel();requestAnimationFrame(()=>searchEl.focus());});
      frag.appendChild(b);
    });
    listEl.appendChild(frag);return;
  }

  const alpha=(a,b)=>a.n.split(/\s+/).slice(-1)[0].localeCompare(b.n.split(/\s+/).slice(-1)[0])||a.n.localeCompare(b.n);
  const matches=P.filter(d=>{
    if(state.team!=="ALL"&&d.tm!==state.team)return false;
    // Search respects the selected season tab, without excluding backups or
    // injured players. Historical careers remain available under All QBs.

  });
  const matchIds=new Set(matches.map(d=>d.id));
  const selectedRows=state.selected.map(id=>byId.get(id)).filter(d=>d&&matchIds.has(d.id));
  const selectedIds=new Set(state.selected);

  if(state.team==="ALL"&&state.pickerMode==="current"){
    listLabelEl.textContent=`${CURRENT_SEASON} quarterbacks · All depth-chart spots`;
  }else if(state.team==="ALL"&&state.pickerMode==="all"){
    listLabelEl.textContent="All quarterbacks since 1950";
  }else if(state.team!=="ALL"){
    listLabelEl.textContent=`${state.pickerMode==="current"?CURRENT_SEASON+" ":""}${TEAM_NAMES[state.team]||state.team} quarterbacks`;
  }
  if(!rows.length){const p=document.createElement("p");p.className="qc-none";p.textContent="No quarterbacks match.";listEl.appendChild(p);return;}
  const full=state.selected.length>=MAX_SEL;
  const frag=document.createDocumentFragment();

    b.className="qc-row";b.setAttribute("role","option");b.setAttribute("aria-pressed",on?"true":"false");b.setAttribute("aria-selected",on?"true":"false");

    b.innerHTML=`<span class="qc-check">${CHECK_SVG}</span><span class="qc-row-id"><p class="qc-row-name">${d.n}</p><p class="qc-row-meta">${era}${status?" &middot; "+status:""} &middot; ${d.pts.length} STARTS</p></span>`;
    b.addEventListener("click",()=>toggle(d.id));frag.appendChild(b);
  });
  listEl.appendChild(frag);
}

/* ---- x-axis builders per view ---- */
function buildSeries(sel){
  const view=state.view;
  const skipped=[];
  const colors=selectedColors(sel.map(d=>d.id));
  // A view-local copy suppresses forecasts without changing the source data.
  let series=sel.filter(validStarts).map(d=>({d:state.metric==="adjusted"?{...d,pj:null}:d,c:colors.get(d.id)}));
  if(view==="age")series=series.filter(sr=>{if(!sr.d.dob){skipped.push(sr.d.n);return false;}return true;});

  if(view==="calendar"){
    const minS=d3.min(series,sr=>sr.d.y0);
    const maxS=d3.max(series,sr=>sr.d.act?2026:sr.d.y1);
    const idx=s=>s-minS;
    series.forEach(sr=>{
      sr.xs=sr.d.pts.map(p=>idx(p[S])+frac(p[S],p[W]));
      sr.px=sr.d.pj?idx(sr.d.pj.s)+frac(sr.d.pj.s,sr.d.pj.w):null;
    });
    const seasons=d3.range(minS,maxS+1);
    return {series,skipped,dom:[-0.06,seasons.length-1+0.35],
      rules:seasons.map((s,i)=>({x:i,label:s}))};
  }
  if(view==="game"){
    let maxN=0;
    series.forEach(sr=>{
      sr.xs=sr.d.pts.map((p,k)=>k+1);
      sr.px=sr.d.pj?sr.d.pts.length+1:null;
      maxN=Math.max(maxN,sr.d.pts.length+(sr.d.pj?1:0));
    });
    let step=[10,20,25,50,100].find(t=>maxN/t<=14)||100;
    const rules=[];
    for(let g=step;g<=maxN;g+=step)rules.push({x:g,label:g});
    return {series,skipped,dom:[0,maxN+Math.max(4,maxN*0.03)],rules};
  }
  if(view==="season"){
    let maxY=0;
    series.forEach(sr=>{
      sr.xs=sr.d.pts.map(p=>(p[S]-sr.d.y0)+frac(p[S],p[W]));
      sr.px=sr.d.pj?(sr.d.pj.s-sr.d.y0)+frac(sr.d.pj.s,sr.d.pj.w):null;
      maxY=Math.max(maxY,sr.d.act?(2026-sr.d.y0):(sr.d.y1-sr.d.y0+1));
    });
    const step=maxY>14?2:1;
    const rules=[];
    for(let k=0;k<=maxY;k+=1)rules.push({x:k,label:(k%step===0)?`YR ${k+1}`:null});
    return {series,skipped,dom:[-0.06,maxY+0.4],rules};
  }
  /* age */
  let lo=Infinity,hi=-Infinity;
  series.forEach(sr=>{
    sr.xs=sr.d.pts.map(p=>ageAt(sr.d.dob,p[D]));
    sr.px=sr.d.act&&sr.d.pj?ageAt(sr.d.dob,sr.d.pj.d):null;
    if(sr.xs.length)lo=Math.min(lo,sr.xs[0]);const endAge=sr.px!=null?sr.px:sr.xs[sr.xs.length-1];if(endAge!=null)hi=Math.max(hi,endAge);
  });
  if(!series.length||!isFinite(lo)||!isFinite(hi)){lo=20;hi=40;}
  const a0=Math.floor(lo),a1=Math.ceil(hi);
  const step=(a1-a0)>14?2:1;
  const rules=[];
  for(let a=a0;a<=a1;a++)rules.push({x:a,label:(a%step===0)?`AGE ${a}`:null});
  return {series,skipped,dom:[a0-0.15,a1+0.3],rules};
}

/* ---- chart ---- */
function drawChart(){
  enforceSelectionLimit();
  if(!state.dots&&!state.trend)state.trend=true;
  svg.selectAll("*").remove();
  tipEl.style.display="none";
  const adjusted=state.metric==="adjusted",valueIndex=adjusted?AQ:V;
  headlineEl.textContent="Compare quarterback careers";
  dekEl.textContent=adjusted?"Compare game-by-game performance for up to four quarterbacks. Hover or tap a trend line to see the corresponding game.":"Compare up to four quarterbacks since 1950. View careers by calendar year, career game, career season, or age.";
  root.classList.toggle("qc-metric-adjusted",adjusted);
  renderChoices();
  trendControl.hidden=!adjusted;
  dotsControl.hidden=!adjusted;
  trendEl.checked=state.trend;
  dotsEl.checked=state.dots;
  connectEl.closest(".qc-toggle").hidden=adjusted;
  chartTitleEl.textContent=adjusted?"Adjusted QBERT by start":"Career QBERT comparison";
  readingKeyEl.hidden=!adjusted;
  readingKeyEl.textContent=!state.dots?"10-start trend · Dots hidden; scale fits trends · 80 = league average":state.trend?"Dots: each start · Line: 10-start trend · 80 = league average":"Dots: each start · 80 = league average";
  const connectUnavailable=state.view==="game";
  connectEl.disabled=connectUnavailable;
  connectEl.closest(".qc-toggle").setAttribute("aria-disabled",connectUnavailable?"true":"false");
  connectEl.closest(".qc-toggle").title=connectUnavailable?"Career-game view already treats consecutive starts as connected.":"Draw dashed lines across missed starts and offseasons.";
  notesEl.textContent=NOTES[state.view]+(adjusted?ADJUSTED_NOTES:NOTES_TAIL);
  agnoteEl.hidden=true;
  agnoteEl.textContent="";

  const sel=state.selected.map(id=>byId.get(id));
  if(!sel.length){
    svgEl.removeAttribute("viewBox");svgEl.style.display="none";
    let empty=wrapEl.querySelector(".qc-empty");
    if(!empty){empty=document.createElement("div");empty.className="qc-empty";empty.textContent="ADD A QUARTERBACK TO BEGIN";wrapEl.appendChild(empty);}
    return;
  }
  svgEl.style.display="block";
  const emptyDiv=wrapEl.querySelector(".qc-empty");
  if(emptyDiv)emptyDiv.remove();

  const noHistory=sel.filter(d=>!validStarts(d));
  if(noHistory.length){
    agnoteEl.hidden=false;
    agnoteEl.textContent=`${adjusted?state.dots?"No adjusted start ratings":"No 10-start trend available":"No recorded starts or scheduled-start projection"}: ${noHistory.map(d=>d.n).join(", ")}.`;
  }
  if(noHistory.length===sel.length){
    svgEl.style.display="none";
    const empty=document.createElement("div");empty.className="qc-empty";
    empty.textContent=adjusted&&!state.dots?"No complete 10-start trend available. Turn on game dots to see individual starts.":"No career-start ratings available for this selection.";
    wrapEl.appendChild(empty);return;
  }
  const {series,skipped,dom,rules}=buildSeries(sel);
  if(skipped.length){
    agnoteEl.hidden=false;
    agnoteEl.textContent+=(noHistory.length?" ":"")+`NO BIRTHDATE ON FILE \u2014 NOT SHOWN IN AGE VIEW: ${skipped.join(", ").toUpperCase()}`;
  }
  if(!series.length)return;

  const narrow=root.clientWidth<560;
  const Wd=Math.max(wrapEl.clientWidth||640,240);
  const H=narrow?360:430;
  const m={t:16,r:narrow?18:22,b:28,l:42};
  svgEl.setAttribute("viewBox",`0 0 ${Wd} ${H}`);
  svg.attr("aria-label",adjusted?(state.dots?"Adjusted QBERT for each NFL start.":"Game dots hidden; vertical scale fits the trends.")+(state.trend?" Trailing 10-start play-weighted trend.":"")+" No player priors.":"Career QBERT timeline for selected quarterbacks");

  const allV=[];
  series.forEach(sr=>{
    const values=adjusted&&!state.dots?adjustedTrend(sr.d.pts):sr.d.pts.map(p=>p[valueIndex]);
    values.forEach(v=>{if(Number.isFinite(v))allV.push(v);});
    if(sr.px!=null)allV.push(sr.d.pj.v);
  });
  if(adjusted)allV.push(80);
  let[v0,v1]=d3.extent(allV);
  const pad=Math.max((v1-v0)*(adjusted&&!state.dots ? .06 : .1),2);
  const y=d3.scaleLinear().domain([v0-pad,v1+pad]).nice().range([H-m.b,m.t]);
  svg.attr("data-y-min",y.domain()[0]).attr("data-y-max",y.domain()[1]).attr("data-game-dots",adjusted&&state.dots?"shown":"hidden");
  const x=d3.scaleLinear().domain(dom).range([m.l,Wd-m.r]);
  // Include every visible point/projection in the x domain (including late playoffs).
  const allX=series.flatMap(sr=>[...sr.xs,...(sr.px==null?[]:[sr.px])]).filter(Number.isFinite);
  const [xlo,xhi]=d3.extent(allX),edge=(dom[1]-dom[0])*.015;
  x.domain([Math.min(dom[0],xlo-edge),Math.max(dom[1],xhi+edge)]);
  const grid=svg.append("g").attr("class","qc-grid");
  y.ticks(5).forEach(t=>{
    grid.append("line").attr("x1",m.l).attr("x2",Wd-m.r).attr("y1",y(t)).attr("y2",y(t));
    svg.append("text").attr("class","qc-ylab").attr("x",m.l-7).attr("y",y(t)+3).attr("text-anchor","end").text(t);
  });
  if(adjusted){
    svg.append("line").attr("class","qc-average-line").attr("x1",m.l).attr("x2",Wd-m.r).attr("y1",y(80)).attr("y2",y(80));
  }

  /* vertical rules */
  const nR=rules.length;
  const rStep=Math.max(1,Math.ceil(nR/Math.max(2,Math.floor((Wd-m.l-m.r)/60))));
  let lastLabelX=-Infinity;
  rules.forEach((r,i)=>{
    svg.append("line").attr("class","qc-season-rule")
      .attr("x1",x(r.x)).attr("x2",x(r.x)).attr("y1",m.t).attr("y2",H-m.b);
    let lab=r.label;
    const last=nR-1;
    if(!(i===last||(i%rStep===0&&last-i>=rStep)))lab=null;
    if(lab!=null&&x(r.x)-lastLabelX>=48){
      svg.append("text").attr("class","qc-ylab")
        .attr("x",Math.min(Wd-m.r,x(r.x))).attr("y",H-m.b+16).attr("text-anchor",i===last?"end":"start").text(lab);
      lastLabelX=x(r.x);
    }
  });

  // Global paint order: every QB's game dots, then every QB's trend lines.
  // Per-player groups alone let later players' dots cover earlier trends.
  const dotLayer=adjusted?svg.append("g").attr("class","qc-dots-layer"):svg;
  const trendLayer=adjusted?svg.append("g").attr("class","qc-trends-layer"):null;
  const flat=[],trendSegments=[];
  series.forEach(sr=>{
    const g=dotLayer.append("g").attr("class","qc-series").attr("data-player",sr.d.id);
    const d=sr.d,c=sr.c;
    if(!d.pts.length){
      if(sr.px!=null){const px=x(sr.px),py=y(d.pj.v);addMarker(g,c,px,py,true);flat.push({d,c,proj:true,v:d.pj.v,cx:px,cy:py});sr.endX=px;sr.endY=py;sr.endV=d.pj.v;}
      return;
    }
    /* segmentation */
    const segs=[];let seg=[0];
    for(let k=1;k<d.pts.length;k++){
      const a=d.pts[k-1],b=d.pts[k];
      const joined=state.view==="game"||(a[S]===b[S]&&(b[W]-a[W])<=3);
      if(joined)seg.push(k);else{segs.push(seg);seg=[k];}
    }
    segs.push(seg);
    if(adjusted){
      const trend=adjustedTrend(d.pts);
      if(state.dots)d.pts.forEach((p,k)=>{
        if(!Number.isFinite(p[AQ]))return;
        const cx=x(sr.xs[k]),cy=y(p[AQ]);
        g.append("circle").attr("class","qc-adjusted-dot").attr("data-player",d.id).attr("data-start",k+1)
          .attr("data-value",p[AQ]).attr("cx",cx).attr("cy",cy).attr("r",narrow?2.7:3.2).attr("fill",c);
        flat.push({d,c,k,v:p[AQ],p,trend:trend[k],cx,cy});
      });
      if(state.trend){
        const tg=trendLayer.append("g").attr("class","qc-trend-series").attr("data-player",d.id);
        const at=k=>({d,c,k,p:d.pts[k],v:trend[k],trend:trend[k],onTrend:true,cx:x(sr.xs[k]),cy:y(trend[k]),gameY:y(d.pts[k][AQ])});
        if(!state.dots)trend.forEach((v,k)=>{if(Number.isFinite(v))flat.push(at(k));});
        const line=d3.line().defined(k=>Number.isFinite(trend[k])).x(k=>x(sr.xs[k])).y(k=>y(trend[k]));
        segs.forEach(sg=>{
          if(!sg.some(k=>Number.isFinite(trend[k])))return;
          tg.append("path").attr("class","qc-trend-halo").attr("d",line(sg));
          tg.append("path").attr("class","qc-trend").attr("data-player",d.id).attr("stroke",c).attr("d",line(sg));
          if(!state.dots)sg.forEach((k,j)=>{
            if(Number.isFinite(trend[k])&&!Number.isFinite(trend[sg[j-1]])&&!Number.isFinite(trend[sg[j+1]]))
              tg.append("circle").attr("class","qc-trend-single").attr("data-player",d.id).attr("cx",x(sr.xs[k])).attr("cy",y(trend[k])).attr("r",2).attr("fill",c);
          });
          // Hit-test only drawn segments, never across missing games or inputs.
          for(let j=1;j<sg.length;j++){
            const a=sg[j-1],b=sg[j];
            if(Number.isFinite(trend[a])&&Number.isFinite(trend[b]))trendSegments.push([at(a),at(b)]);
          }
        });
      }
      return;
    }
    const line=d3.line().x(k=>x(sr.xs[k])).y(k=>y(d.pts[k][V]));
    segs.forEach(sg=>{
      if(sg.length>1)g.append("path").attr("class","qc-path").attr("stroke",c).attr("d",line(sg));
      else g.append("circle").attr("class","qc-lone").attr("fill",c).attr("cx",x(sr.xs[sg[0]])).attr("cy",y(d.pts[sg[0]][V])).attr("r",1.1);
    });
    // Mark only the first occurrence of the career high; forecasts are excluded.
    const peakK=d3.maxIndex(d.pts,p=>p[V]);
    addMarker(g,c,x(sr.xs[peakK]),y(d.pts[peakK][V]));
    /* dashed connectors option */
    if(state.connect&&state.view!=="game"){
      for(let si=1;si<segs.length;si++){
        const a=segs[si-1][segs[si-1].length-1],b=segs[si][0];
        g.append("path").attr("class","qc-gap-link").attr("stroke",c)
          .attr("d",`M${x(sr.xs[a])},${y(d.pts[a][V])}L${x(sr.xs[b])},${y(d.pts[b][V])}`);
      }
    }
    d.pts.forEach((p,k)=>flat.push({d,c,k,peak:k===peakK,v:p[V],p,cx:x(sr.xs[k]),cy:y(p[V])}));
    /* projection */
    const lastK=d.pts.length-1;
    let endX=x(sr.xs[lastK]),endY=y(d.pts[lastK][V]),endV=d.pts[lastK][V];
    if(sr.px!=null){
      const truePx=x(sr.px),px=Math.min(Wd-m.r-1,Math.max(truePx,endX+11)),py=y(d.pj.v);
      g.append("path").attr("class","qc-proj-link").attr("d",`M${endX},${endY}L${px},${py}`);
      addMarker(g,c,px,py,true);
      flat.push({d,c,proj:true,v:d.pj.v,cx:px,cy:py});
      endX=px;endY=py;endV=d.pj.v;
    }
    sr.endX=endX;sr.endY=endY;sr.endV=endV;
  });

  /* hover */
  const hoverLayer=svg.append("g").attr("class","qc-hover-layer"),guideLayer=adjusted?dotLayer:hoverLayer;
  const guide=guideLayer.append("line").attr("class","qc-hover-guide").style("display","none").attr("y1",m.t).attr("y2",H-m.b);
  const hdot=hoverLayer.append("circle").attr("class","qc-hover-dot").attr("r",4).style("display","none");
  const gameDot=hoverLayer.append("circle").attr("class","qc-hover-game").attr("r",5.5).style("display","none");
  const gameLink=guideLayer.append("line").attr("class","qc-hover-link").style("display","none");
  const overlay=svg.append("rect").attr("x",m.l).attr("y",m.t).attr("width",Wd-m.l-m.r).attr("height",H-m.t-m.b)
    .attr("class","qc-hover-overlay").attr("fill","transparent").style("cursor","crosshair");

  function move(ev){
    const pt=svgEl.createSVGPoint();pt.x=ev.clientX;pt.y=ev.clientY;
    const ctm=svgEl.getScreenCTM();
    if(!ctm)return;
    const loc=pt.matrixTransform(ctm.inverse());
    let best=null,bd=Infinity;
    flat.forEach(f=>{
      const dx=f.cx-loc.x,dy=f.cy-loc.y;
      const dist=dx*dx*(adjusted?1:1.6)+dy*dy;
      if(dist<bd){bd=dist;best=f;}
    });
    if(adjusted&&state.trend){
      let hit=null,td=Infinity;
      trendSegments.forEach(([a,b])=>{
        const dx=b.cx-a.cx,dy=b.cy-a.cy;
        const t=Math.max(0,Math.min(1,((loc.x-a.cx)*dx+(loc.y-a.cy)*dy)/(dx*dx+dy*dy||1)));
        const dist=(loc.x-a.cx-t*dx)**2+(loc.y-a.cy-t*dy)**2;
        if(dist<td){td=dist;hit=Math.abs(loc.x-a.cx)<=Math.abs(loc.x-b.cx)?a:b;}
      });
      // Target the closest visible mark (point or line),
      // then snap within that QB's segment to an actual start — not a made-up game.
      const radius=(ev.pointerType==="touch"?22:12)/Math.hypot(ctm.a,ctm.b);
      if(hit&&td<=radius*radius&&td<bd)best=hit;
    }
    if(!best){hide();return;}
    guide.style("display",null).attr("x1",best.cx).attr("x2",best.cx);
    hdot.style("display",null).attr("cx",best.cx).attr("cy",best.cy).attr("stroke",best.c);
    const linked=adjusted&&state.dots&&state.trend&&Number.isFinite(best.trend);
    const otherY=best.onTrend?best.gameY:y(best.trend);
    gameDot.style("display",linked?null:"none").attr("cx",best.cx).attr("cy",linked?otherY:0).attr("stroke",best.c);
    gameLink.style("display",linked?null:"none").attr("x1",best.cx).attr("x2",best.cx)
      .attr("y1",best.cy).attr("y2",linked?otherY:best.cy).attr("stroke",best.c);
    if(adjusted){
      // Even the highlighted game dot stays beneath the trends. Only the
      // marker identifying a trend value belongs in the top interaction layer.
      (best.onTrend?hoverLayer:dotLayer).node().appendChild(hdot.node());
      (best.onTrend?dotLayer:hoverLayer).node().appendChild(gameDot.node());
      svg.selectAll(".qc-series,.qc-trend-series").style("opacity",function(){return this.dataset.player===best.d.id?1:.22;});
      svg.selectAll(".qc-trend").style("stroke-width",function(){return this.dataset.player===best.d.id?3.3:null;});
    }
    let when;
    if(best.proj)when=`${best.d.pj.s} WEEK ${best.d.pj.w} PROJECTION`;
    else{
      const p=best.p;
      when=`${best.peak?"CAREER PEAK \u00b7 ":""}${p[S]} ${p[PF]?"PLAYOFFS":"WEEK"} ${p[W]} \u00b7 START #${best.k+1}<span class="qc-tooltip-date">${fmtDate(dnum(p[D]))}</span>`;
    }
    tipEl.dataset.player=best.d.id;
    tipEl.dataset.start=best.proj?"":best.k+1;
    tipEl.dataset.kind=best.onTrend?"trend":best.proj?"projection":"game";
    tipEl.style.borderLeft=`3px solid ${best.c}`;
    // A dot and its trend value describe the same start: never swap the
    // metric order, typography, or card width according to the hovered mark.
    tipEl.innerHTML=`<div class="qc-tooltip-player">${best.d.n}</div><div class="qc-tooltip-title">${when}</div>`+
      (adjusted?`<div class="qc-tooltip-metrics">
        <div class="qc-tooltip-metric" data-tooltip-stat="game"><span>Game Adjusted QBERT</span><strong>${best.p[AQ].toFixed(2)}</strong></div>
        ${state.trend?`<div class="qc-tooltip-metric" data-tooltip-stat="trend"><span>10-start trend</span><strong>${Number.isFinite(best.trend)?best.trend.toFixed(2):"—"}</strong></div>`:""}
      </div>`:`<div class="qc-tooltip-value">QBERT ${best.v.toFixed(2)}</div>`);
    tipEl.style.display="block";
    const wr=wrapEl.getBoundingClientRect();
    const sx=wr.width/Wd;
    const px=best.cx*sx,py=best.cy*(wr.height/H);
    const tw=tipEl.offsetWidth,th=tipEl.offsetHeight;
    let tx=px+12,ty=py-th-14;
    if(tx+tw>wr.width-4)tx=px-tw-12;
    if(ty<0)ty=py+14;
    tipEl.style.left=Math.max(0,Math.min(tx,wr.width-tw))+"px";
    tipEl.style.top=Math.max(0,Math.min(ty,wr.height-th))+"px";
  }
  function hide(){
    guide.style("display","none");hdot.style("display","none");gameDot.style("display","none");gameLink.style("display","none");tipEl.style.display="none";
    svg.selectAll(".qc-series,.qc-trend-series").style("opacity",null);svg.selectAll(".qc-trend").style("stroke-width",null);
  }
  overlay.on("pointermove",move).on("pointerleave",ev=>{if(ev.pointerType!=="touch")hide();}).on("click",move);
}


function renderPredictions(){
  if(!predictionsEl)return;
  predictionsEl.innerHTML="";
  if(state.metric==="adjusted"){predictionsEl.closest(".qc-predictions").hidden=true;return;}
  const colors=selectedColors();
  const selected=state.selected.map(id=>({d:byId.get(id),c:colors.get(id)})).filter(item=>item.d&&item.d.pj);
  const section=predictionsEl.closest(".qc-predictions");
  section.hidden=!selected.length;
  if(!selected.length)return;
  const projectionWeeks=[...new Set(selected.filter(item=>item.d.pj).map(item=>`${item.d.pj.s}|${item.d.pj.w}`))];
  if(projectionWeeks.length===1){
    const [season,week]=projectionWeeks[0].split("|");
    predictionsLabelEl.textContent=`Week ${week} projection`;
    predictionsEl.closest(".qc-predictions").setAttribute("aria-label",`${season} Week ${week} projections`);
  }else{
    predictionsLabelEl.textContent="Next-week projection";
    predictionsEl.closest(".qc-predictions").setAttribute("aria-label","Next-week projections");
  }
  selected.forEach(({d,c})=>{
    const item=document.createElement("div");
    item.className="qc-prediction";
    item.style.setProperty("--pc",c);
    const projection=d.pj?fmt1(d.pj.v):"—";
    item.innerHTML=`<span class="qc-prediction-name">${d.n}</span><span class="qc-prediction-meta">${d.tm}</span><strong class="qc-prediction-value">${projection}</strong>`;
    predictionsEl.appendChild(item);
  });
}

function render(){enforceSelectionLimit();renderLegend();renderPredictions();renderPanel();drawChart();reportHeight();}


pickerTabs.forEach(tab=>tab.addEventListener("click",()=>{state.pickerMode=tab.dataset.pickerMode;state.search="";searchEl.value="";renderPanel();requestAnimationFrame(()=>searchEl.focus());}));
teamFilterBtn.addEventListener("click",()=>{state.team="ALL";renderPanel();requestAnimationFrame(()=>searchEl.focus());});
searchEl.addEventListener("input",e=>{state.search=e.target.value;renderPanel();});
teamSel.addEventListener("change",e=>{state.team=e.target.value;renderPanel();});
activeBtn.addEventListener("click",()=>{state.activeOnly=!state.activeOnly;activeBtn.setAttribute("aria-pressed",state.activeOnly?"true":"false");renderPanel();});
panelToggle.addEventListener("click",()=>{closeChoices();state.panelOpen=!state.panelOpen;renderPanel();if(state.panelOpen)requestAnimationFrame(()=>searchEl.focus());});
choiceMenus.forEach(menu=>{
  const trigger=menu.querySelector(".qc-choice-toggle");
  const options=[...menu.querySelectorAll("[data-value]")];
  trigger.addEventListener("click",()=>menu.classList.contains("is-open")?closeChoices():openChoice(menu));
  trigger.addEventListener("keydown",e=>{
    if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();e.stopPropagation();openChoice(menu);}
  });
  options.forEach(option=>option.addEventListener("click",()=>{
    closeChoices();
    if(menu.dataset.choice==="metric")changeMetric(option.dataset.value);
    else{state.view=option.dataset.value;drawChart();}
    trigger.focus({preventScroll:true});
  }));
  menu.addEventListener("keydown",e=>{
    if(!menu.classList.contains("is-open"))return;
    if(e.key==="Escape"){e.preventDefault();closeChoices();trigger.focus({preventScroll:true});return;}
    const index=options.indexOf(document.activeElement);
    if(index<0)return;
    const next=e.key==="ArrowDown"?(index+1)%options.length:e.key==="ArrowUp"?(index+options.length-1)%options.length:e.key==="Home"?0:e.key==="End"?options.length-1:null;
    if(next!==null){e.preventDefault();options[next].focus({preventScroll:true});}
  });
});
function dismissOutside(event){
  choiceMenus.forEach(menu=>{if(menu.classList.contains("is-open")&&!menu.contains(event.target))closeChoices();});
  if(state.panelOpen&&!panelToggle.closest(".qc-panel").contains(event.target)){state.panelOpen=false;renderPanel();}
}
document.addEventListener("pointerdown",dismissOutside);
document.addEventListener("focusin",dismissOutside);
panelToggle.closest(".qc-panel").addEventListener("keydown",e=>{
  if(state.panelOpen&&e.key==="Escape"){e.preventDefault();state.panelOpen=false;renderPanel();panelToggle.focus({preventScroll:true});}
});
trendEl.addEventListener("change",e=>{state.trend=e.target.checked;if(!state.trend)state.dots=true;drawChart();});
dotsEl.addEventListener("change",e=>{state.dots=e.target.checked;if(!state.dots)state.trend=true;drawChart();});
connectEl.addEventListener("change",e=>{state.connect=e.target.checked;drawChart();});

let rT=null;
new ResizeObserver(()=>{clearTimeout(rT);rT=setTimeout(drawChart,120);}).observe(wrapEl);

let lastH=0;
function reportHeight(){
  if(window.parent===window)return;
  const style=getComputedStyle(document.body);
  const h=Math.ceil(Math.max(root.scrollHeight,root.getBoundingClientRect().height)+parseFloat(style.paddingTop||0)+parseFloat(style.paddingBottom||0));
  if(h===lastH)return;
  lastH=h;
  window.parent.postMessage({type:"substack-code-embed",source:"height",height:h},"*");
  window.parent.postMessage({type:"silver-bulletin:embed-height",height:h},"*");
}
new ResizeObserver(reportHeight).observe(root);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(reportHeight);
window.addEventListener("resize",reportHeight);
window.addEventListener("load",reportHeight);

document.documentElement.dataset.feedStatus="loading";
Promise.allSettled([fetchSheet(SHEET_CAREER),fetchSheet(SHEET_ROSTER)]).then(([career,roster])=>{
  if(career.status!=="fulfilled"||!career.value.length||roster.status!=="fulfilled"||!roster.value.length){document.documentElement.dataset.feedStatus="unavailable";__sbUnavailable();console.warn("QBERT career chart: current approved data is incomplete.");return;}
  const changed=applyCareerRows(career.value,roster.value);
  if(!changed){document.documentElement.dataset.feedStatus="unavailable";__sbUnavailable();return;}
  render();
  document.documentElement.dataset.feedStatus="approved";
});
</script>
