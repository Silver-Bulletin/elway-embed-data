<style>

#qbert-leaderboard{--ink:#101214;--green:#04ff40;--headline:"Archivo Narrow","Arial Narrow",Arial,sans-serif;--sans:"Geist",Arial,Helvetica,sans-serif;--mono:"Geist Mono",SFMono-Regular,Menlo,Consolas,monospace;max-width:740px;margin:0 auto;color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
#qbert-leaderboard *{box-sizing:border-box}
#qbert-leaderboard .qbl-brandmark{width:28px;height:6px;margin-bottom:8px;background:var(--green)}
#qbert-leaderboard h1{margin:0;font:700 34px/1.02 var(--headline);letter-spacing:-.015em}
#qbert-leaderboard .qbl-dek{max-width:680px;margin:10px 0 0;color:#454c52;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,Helvetica,sans-serif!important;font-size:15px;font-style:normal;font-weight:400!important;line-height:1.42;font-synthesis:none}
#qbert-leaderboard .qbl-tabs{display:none}
#qbert-leaderboard .qbl-boards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:22px}
#qbert-leaderboard .qbl-board{min-width:0;background:#fff}
#qbert-leaderboard .qbl-board-head{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:36px;padding:7px 12px 8px;background:var(--green);color:var(--ink)}
#qbert-leaderboard .qbl-board-head h2{margin:0;color:var(--ink);font:750 13px/1.08 var(--sans);letter-spacing:-.005em}
#qbert-leaderboard .qbl-board-period{flex:0 0 auto;font:600 8px/1 var(--mono);letter-spacing:.04em}
#qbert-leaderboard .qbl-list{display:grid;gap:0;margin:0;padding:0;border-bottom:1px solid var(--ink);list-style:none}
#qbert-leaderboard .qbl-entry{display:grid;grid-template-columns:38px 1px minmax(0,1fr) 54px;align-items:center;min-height:66px;border-bottom:1px solid rgba(16,18,20,.14);background:#fff}
#qbert-leaderboard .qbl-entry:last-child{border-bottom:0}
#qbert-leaderboard .qbl-rank{justify-self:center;color:var(--ink);font:400 25px/1 var(--sans);font-variant-numeric:tabular-nums}
#qbert-leaderboard .qbl-divider{align-self:stretch;width:1px;height:auto;background:rgba(16,18,20,.16)}
#qbert-leaderboard .qbl-identity{min-width:0;padding:0 7px 0 12px}
#qbert-leaderboard .qbl-identity strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px;font-weight:750;line-height:1.08}
#qbert-leaderboard .qbl-name-full{display:none}
#qbert-leaderboard .qbl-identity small{display:flex;align-items:center;gap:5px;margin-top:5px;color:var(--ink);font:800 11px/1 var(--sans)}
#qbert-leaderboard .qbl-team-logo{display:block;width:22px;height:22px;object-fit:contain}
#qbert-leaderboard .qbl-score{align-self:stretch;display:grid;place-items:center;padding:0 4px;background:var(--heat);color:var(--heat-ink);font:600 14px/1 var(--mono);font-variant-numeric:tabular-nums}
#qbert-leaderboard .qbl-footer{display:flex;justify-content:space-between;align-items:end;gap:18px;margin-top:16px;padding-top:12px;border-top:1px solid rgba(11,67,137,.16)}
#qbert-leaderboard .qbl-notes{max-width:575px;color:#697178;font:400 8px/1.45 var(--mono)}
#qbert-leaderboard .qbl-wordmark{display:block;width:104px;height:auto}
@media(max-width:620px){
  #qbert-leaderboard{padding:0 2px}
  #qbert-leaderboard h1{font-size:31px}
  #qbert-leaderboard .qbl-dek{font-size:14px}
  #qbert-leaderboard .qbl-tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:18px;border:1px solid var(--ink)}
  #qbert-leaderboard .qbl-tabs button{min-height:44px;padding:6px 4px;border:0;border-left:1px solid var(--ink);background:#fff;color:var(--ink);font:750 8px/1.15 var(--mono);cursor:pointer}
  #qbert-leaderboard .qbl-tabs button:first-child{border-left:0}
  #qbert-leaderboard .qbl-tabs button[aria-selected="true"]{background:var(--ink);color:#fff;box-shadow:inset 0 -4px 0 var(--green)}
  #qbert-leaderboard .qbl-boards{display:block;margin-top:10px}
  #qbert-leaderboard .qbl-board{display:none}
  #qbert-leaderboard .qbl-board.is-active{display:block}
  #qbert-leaderboard .qbl-entry{grid-template-columns:42px 1px minmax(0,1fr) 64px;min-height:66px}
  #qbert-leaderboard .qbl-rank{font-size:27px}
  #qbert-leaderboard .qbl-identity strong{font-size:17px}
  #qbert-leaderboard .qbl-name-short{display:none}
  #qbert-leaderboard .qbl-name-full{display:inline}
  #qbert-leaderboard .qbl-identity small{font-size:10px}
  #qbert-leaderboard .qbl-team-logo{width:21px;height:21px}
  #qbert-leaderboard .qbl-score{font-size:16px}
  #qbert-leaderboard .qbl-footer{align-items:flex-start}
  #qbert-leaderboard .qbl-wordmark{width:96px}
}
@media(max-width:360px){
  #qbert-leaderboard .qbl-tabs button{font-size:7px}
  #qbert-leaderboard .qbl-entry{grid-template-columns:38px 1px minmax(0,1fr) 58px}
  #qbert-leaderboard .qbl-rank{font-size:24px}
  #qbert-leaderboard .qbl-score{font-size:15px}
}

    const hosted=new URL('../data/latest/'+file,window.location.href);
    hosted.searchParams.set('_',Date.now().toString());
    return hosted;
  }catch(_error){return null;}
}

async function fetchSheet(source){
  const hosted=__sbHostedFeed(source);
  if(!hosted)return fetchGoogleSheet(source);
  const cacheKey='silver-bulletin:hosted-feed:'+hosted.pathname;
  try{
    const response=await fetch(hosted,{cache:'no-store',credentials:'omit'});
    if(!response.ok)throw new Error('Hosted feed returned HTTP '+response.status);
    const text=await response.text();
    if(!text||/^\s*</.test(text))throw new Error('Hosted feed returned invalid content');
    try{localStorage.setItem(cacheKey,text)}catch(_error){}
    return parseCSV(text);
  }catch(error){
    let cached='';try{cached=localStorage.getItem(cacheKey)||''}catch(_error){}
    if(cached){document.documentElement.dataset.feedTransport='cached-hosted';return parseCSV(cached);}
    console.warn('Hosted approved feed unavailable; trying the source Sheet.',error);
    return fetchGoogleSheet(source);
  }

  const BOARDS=[
    {key:"adjusted",name:"player_qbert",value:"adj_qbert",fmt:v=>v.toFixed(1)},
    {key:"war",name:"player_war",value:"war",fmt:v=>(v>=0?"+":"")+v.toFixed(1)},
    {key:"projected",name:"player_prior",value:"current_rating",fmt:v=>v.toFixed(1)}
  ];
  const HEAT=[["#1318B2","#FFFFFF"],["#4FBED8","#101214"],["#82D7E7","#101214"],["#A9E4EF","#101214"],["#CCEFF6","#101214"]];
  const TOP_N=5;
  const escapeHtml=value=>String(value==null?"":value).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
  const SUFFIX=/^(jr|sr|ii|iii|iv|v)\.?$/i;
  const lastWord=name=>{const parts=String(name||"").trim().split(/\s+/);while(parts.length>1&&SUFFIX.test(parts[parts.length-1]))parts.pop();return parts[parts.length-1]||"";};
  const norm=s=>String(s||"").toLowerCase().replace(/[.'’\-\s]/g,"");

  function buildRoster(records){
    return records.filter(r=>(r.player||"").trim()).map(r=>({
      team:(r.team||"").trim().toUpperCase(),
      order:num(String(r.order||"").replace(/\D/g,""))??99,
      player:r.player.trim(),
      display:(r.displayname||"").trim()||lastWord(r.player),
      starter:flag(r.current_starter)?1:0,
      rating:num(r.qbert)??-Infinity
    }));
  }
  function buildTeams(records,base){
    const map=new Map(base||[]);
    records.forEach(r=>{
      const code=(r.team||"").trim().toUpperCase();if(!code)return;
      const prev=map.get(code)||{};
      map.set(code,{code,name:(r.team_name||"").trim()||prev.name||"",color:(r.color||"").trim()||prev.color||"",logo:(r.logo||"").trim()||prev.logo||""});
    });
    return map;
  }
  /* "Purdy" / "J. Allen" -> {short:"B. Purdy", full:"Brock Purdy", team:"SF"} */
  function resolve(shortName,roster){
    const raw=String(shortName||"").trim();
    const m=raw.match(/^([A-Za-z])\.?\s+(.+)$/);
    const initial=m?m[1].toUpperCase():null;
    const part=m?m[2]:raw;
    const keys=new Set([norm(part),norm(lastWord(part))]);
    let cands=roster.filter(r=>keys.has(norm(r.display))||keys.has(norm(lastWord(r.player))));
    if(initial)cands=cands.filter(r=>r.player[0].toUpperCase()===initial);
    if(!cands.length)cands=roster.filter(r=>norm(r.player)===norm(raw));
    if(!cands.length)return {short:raw,full:raw,team:""};
    cands.sort((a,b)=>(b.starter-a.starter)||(a.order-b.order)||(b.rating-a.rating));
    const r=cands[0];
    return {short:`${r.player[0].toUpperCase()}. ${r.display}`,full:r.player,team:r.team};
  }
  function boardRows(records,board){
    return records.map(r=>({rank:num(r.rank),name:(r[board.name]||"").trim(),value:num(r[board.value])}))
      .filter(r=>r.name&&r.value!=null)
      .sort((a,b)=>(a.rank??99)-(b.rank??99))
      .slice(0,TOP_N);
  }
  function entryHtml(i,who,team,score){
    const [bg,ink]=HEAT[Math.min(i,HEAT.length-1)];
    const logo=team&&team.logo?`<img class="qbl-team-logo" src="${escapeHtml(team.logo)}" alt width="22" height="22" loading="lazy" decoding="async" />`:"";
    const teamHtml=who.team?`<small>${logo}${escapeHtml(who.team)}</small>`:"";
    return `<li class="qbl-entry">
      <span class="qbl-rank">${i+1}</span>
      <span class="qbl-divider" aria-hidden="true"></span>
      <span class="qbl-identity"><strong title="${escapeHtml(who.full)}"><span class="qbl-name-short">${escapeHtml(who.short)}</span><span class="qbl-name-full">${escapeHtml(who.full)}</span></strong>${teamHtml}</span>
      <span class="qbl-score" style="--heat:${bg};--heat-ink:${ink}">${score}</span>
    </li>`;
  }

  const state={
    fallbackLeaders:parseCSV(FALLBACK_LEADERS_CSV),
    leaders:null,
    roster:buildRoster(parseCSV(FALLBACK_ROSTER_CSV)),
    teams:buildTeams(parseCSV(FALLBACK_TEAMS_CSV)),
    projection:FALLBACK_PROJECTION
  };
  const dekEl=root.querySelector(".qbl-dek");
  const periodEl=root.querySelector(".qbl-board-period");

  function render(){
    BOARDS.forEach(board=>{
      const list=root.querySelector(`.qbl-list[data-list="${board.key}"]`);
      if(!list)return;
      let rows=state.leaders?boardRows(state.leaders,board):[],source="live";
      if(!rows.length){rows=boardRows(state.fallbackLeaders,board);source="fallback";}
      list.closest(".qbl-board").dataset.source=source;
      list.innerHTML=rows.map((row,i)=>{const who=resolve(row.name,state.roster);return entryHtml(i,who,state.teams.get(who.team),board.fmt(row.value));}).join("");
    });
    /* copy: the adjusted/WAR boards describe the current season once the live sheet has values for them */
    const adjustedLive=root.querySelector('.qbl-board[data-board="adjusted"]').dataset.source==="live";
    const statsSeason=adjustedLive?state.projection.season:FALLBACK_STATS_SEASON;
    if(dekEl)dekEl.textContent=`The top five quarterbacks by ${statsSeason} performance, total value, and the model's Week ${state.projection.week} ${state.projection.season} outlook`;
    if(periodEl)periodEl.textContent=`WEEK ${state.projection.week}`;
    requestAnimationFrame(reportHeight);
  }

  function reportHeight(){
    if(window.parent===window)return;
    const s=getComputedStyle(document.body);
    const height=Math.ceil(root.getBoundingClientRect().height+parseFloat(s.paddingTop||0)+parseFloat(s.paddingBottom||0));
    window.parent.postMessage({type:"silver-bulletin:embed-height",height},"*");
  }
  buttons.forEach(button=>button.addEventListener("click",()=>{
    buttons.forEach(item=>item.setAttribute("aria-selected",String(item===button)));
    boards.forEach(board=>board.classList.toggle("is-active",board.dataset.board===button.dataset.target));
    requestAnimationFrame(reportHeight);
  }));
  if("ResizeObserver" in window)new ResizeObserver(reportHeight).observe(root);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(reportHeight);
  window.addEventListener("load",reportHeight);
  window.addEventListener("resize",reportHeight);

  render();
  document.documentElement.dataset.feedStatus="fallback";
  Promise.allSettled([fetchSheet(SHEET_LEADERS),fetchSheet(SHEET_ROSTER),Promise.resolve([]),fetchSheet(SHEET_SCHEDULE)]).then(([leaders,roster,teams,schedule])=>{
    if(schedule.status==="fulfilled"&&schedule.value.length){const r=schedule.value[0],season=num(r.season),week=num(r.week);if(season!=null&&week!=null)state.projection={season,week};}
    if(roster.status==="fulfilled"&&roster.value.length)state.roster=buildRoster(roster.value);
    if(teams.status==="fulfilled"&&teams.value.length)state.teams=buildTeams(teams.value,state.teams);
    if(leaders.status==="fulfilled"){state.leaders=leaders.value;document.documentElement.dataset.feedStatus="approved";}
    else console.warn("QBERT leaderboard: showing embedded data.",leaders.reason&&leaders.reason.message);
    render();
  });
