<style>

@font-face{font-family:"Geist";src:url("https://fonts.gstatic.com/s/geist/v5/gyBhhwUxId8gMGYQMKR3pzfaWI_RQuQ4nQ.ttf") format("truetype");font-style:normal;font-weight:400 800;font-display:swap}
@font-face{font-family:"Geist Mono";src:url("https://fonts.gstatic.com/s/geistmono/v6/or3nQ6H-1_WfwkMZI_qYFrcdmhHkjko.woff2") format("woff2");font-style:normal;font-weight:400 900;font-display:swap}
#sb-elway-paths{--green:#04ff40;font-family:Geist,Arial,sans-serif;color:#101214;background:#fff;max-width:1100px;margin:auto;font-size:13px;font-weight:400;color-scheme:light;padding:20px 0}
#sb-elway-paths *{box-sizing:border-box}
#sb-elway-paths .kicker{width:27px;height:0;margin:0 0 5px;border-bottom:5.5px solid var(--green)}
#sb-elway-paths h2{font-family:'Archivo Narrow',Arial,sans-serif;font-size:28px;line-height:1.15;margin:0 0 8px;font-weight:700}
#sb-elway-paths .intro{font-size:16px;color:#757575;line-height:1.45;margin:0 0 18px}
#sb-elway-paths .toolbar{display:flex;justify-content:space-between;gap:14px;align-items:flex-end;margin-bottom:18px;flex-wrap:wrap}
#sb-elway-paths .picker{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
#sb-elway-paths .selectors{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
#sb-elway-paths .picker-field{display:grid;gap:5px}
#sb-elway-paths .picker-label{font:600 10px/1.2 'Geist Mono',monospace;color:#68685f;letter-spacing:.04em;text-transform:uppercase}
#sb-elway-paths button,#sb-elway-paths select{font:400 12px Geist,Arial,sans-serif;border:1px solid #cfd5d9;border-radius:3px;padding:9px 12px;background:white;color:#101214;cursor:pointer;min-height:38px}
#sb-elway-paths select{min-width:210px}
#sb-elway-paths button[aria-pressed=true],#sb-elway-paths .add{background:#101214;color:white;border-color:#101214}
#sb-elway-paths button:disabled{opacity:.45;cursor:default}
#sb-elway-paths button:focus-visible,#sb-elway-paths select:focus-visible{outline:2px solid var(--green);outline-offset:2px}
#sb-elway-paths .guide{font-size:12px;color:#68685f}
#sb-elway-paths .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:25px 24px}
#sb-elway-paths .grid.single{grid-template-columns:1fr}
#sb-elway-paths .panel{position:relative;border-top:1px solid #cfd5d9;padding:12px 0 0;min-width:0;background:white;width:100%}
#sb-elway-paths .panel:hover{background:#fafbfb}
#sb-elway-paths .panel-open{display:block;border:0;padding:0;text-align:left;background:transparent;width:100%;min-height:0}
#sb-elway-paths .panel-open:focus-visible{outline:2px solid var(--green);outline-offset:4px}
#sb-elway-paths .panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;gap:8px}
#sb-elway-paths .identity{display:flex;align-items:center;gap:7px;font-size:13px}
#sb-elway-paths .team-logo{width:26px;height:26px;object-fit:contain}
#sb-elway-paths .pill{color:white;background:var(--team);border-radius:20px;padding:3px 8px;font-size:12px}
#sb-elway-paths .rating{font-size:19px;font-weight:400;font-variant-numeric:tabular-nums;padding-right:34px}
#sb-elway-paths .grid.single .rating{padding-right:0}
#sb-elway-paths .remove{position:absolute;right:0;top:9px;z-index:3;border:0;background:transparent!important;color:#68685f!important;padding:4px 7px;min-height:28px;font-size:17px;line-height:1}
#sb-elway-paths svg{display:block;width:100%;height:auto;overflow:visible}
#sb-elway-paths svg text{font-family:Geist,Arial,sans-serif;font-size:12px;fill:#101214}
#sb-elway-paths .week-dot{pointer-events:none}
#sb-elway-paths .week-hit{cursor:crosshair;pointer-events:all}
#sb-elway-paths .chart-tooltip{position:absolute;z-index:5;display:block;pointer-events:none;opacity:0;transform:translate(-50%,-100%);padding:6px 8px;border:1px solid #cfd5d9;border-radius:3px;background:#fff;color:#101214;box-shadow:0 3px 12px #1012141f;font:400 11px/1.2 Geist,Arial,sans-serif;white-space:nowrap;transition:opacity .08s}
#sb-elway-paths .chart-tooltip.show{opacity:1}
#sb-elway-paths .panel-bottom{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#68685f;margin-top:2px}
#sb-elway-paths .delta{color:#101214;font-variant-numeric:tabular-nums}
#sb-elway-paths .up{color:#218739;font-size:9px}
#sb-elway-paths .down{color:#c63232;font-size:9px}
#sb-elway-paths .empty{border-top:1px solid #cfd5d9;padding:24px 0;color:#68685f}
#sb-elway-paths .error{display:none;color:#8b2f1c;margin:10px 0;font-size:12px}
#sb-elway-paths .error.show{display:block}
#sb-elway-paths footer{border-top:1px solid #cfd5d9;margin-top:24px;padding-top:12px;display:flex;gap:12px;justify-content:space-between;align-items:center;color:#68685f;font-size:11px;line-height:1.5}
#sb-elway-paths .wordmark{display:block;width:100px;height:auto;margin-left:auto;flex:0 0 auto}
#sb-elway-paths dialog{font:400 13px Geist,Arial,sans-serif;color:#101214;background:white;border:1px solid #cfd5d9;border-radius:3px;max-width:720px;width:calc(100% - 28px);max-height:90vh;padding:24px}
#sb-elway-paths dialog::backdrop{background:#10121480}
#sb-elway-paths .detail-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
#sb-elway-paths .detail-title{font-size:22px;font-family:'Archivo Narrow';font-weight:700}
#sb-elway-paths .detail-stats{margin-bottom:10px;color:#68685f}
#sb-elway-paths table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
#sb-elway-paths th,#sb-elway-paths td{text-align:right;border-bottom:1px solid #e5e8eb;padding:8px;font-weight:400}
#sb-elway-paths th:first-child,#sb-elway-paths td:first-child{text-align:left}
#sb-elway-paths .table-scroll{max-height:240px;overflow:auto}
#sb-elway-paths th{position:sticky;top:0;background:white}
@media(max-width:620px){#sb-elway-paths svg text{font-size:15px}#sb-elway-paths dialog svg text{font-size:20px}#sb-elway-paths .grid{grid-template-columns:1fr;gap:22px}#sb-elway-paths h2{font-size:26px}#sb-elway-paths .toolbar{align-items:flex-start}#sb-elway-paths .intro{font-size:14px}#sb-elway-paths .rating{font-size:17px}#sb-elway-paths .team-logo{width:22px;height:22px}#sb-elway-paths select{min-width:190px;max-width:calc(100vw - 120px)}#sb-elway-paths .wordmark{width:78px}}

const dialog=root.querySelector('dialog');function detail(t){root.querySelector('.detail-title').textContent=t.full;root.querySelector('.detail-stats').textContent=`${fmt(end(t).value)} · ${end(t).week===0?'Preseason':'Week '+end(t).week} · ${fmt(end(t).value-t.points[0].value)} since preseason`;root.querySelector('.detail-chart').innerHTML=chart(t,true);root.querySelector('tbody').innerHTML=t.points.map((p,idx)=>`<tr><td>${p.week===0?'Preseason':'Week '+p.week}</td><td>${fmt(p.value)}</td><td>${idx?delta(p.value-t.points[idx-1].value):'—'}</td></tr>`).join('');dialog.showModal()}root.querySelector('.close').addEventListener('click',()=>dialog.close());dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close()}});
function updatedLabel(iso){const d=new Date(iso);if(!Number.isFinite(d.valueOf()))return null;const opts={timeZone:'America/New_York'};return 'Updated '+new Intl.DateTimeFormat('en-US',{...opts,month:'long',day:'numeric',year:'numeric'}).format(d)+' at '+new Intl.DateTimeFormat('en-US',{...opts,hour:'numeric',minute:'2-digit',timeZoneName:'short'}).format(d)}
async function refresh(){try{const response=await fetch(DATA_URL+'?v='+Date.now(),{cache:'no-store',credentials:'omit'});if(!response.ok)throw Error('HTTP '+response.status);const text=await response.text();teams=makeTeams(parseCSV(text));try{localStorage.setItem(CACHE_KEY+':data',text)}catch(_){}errorBox.classList.remove('show');try{const mr=await fetch(MANIFEST_URL+'?v='+Date.now(),{cache:'no-store',credentials:'omit'}),manifest=mr.ok?await mr.json():null;if(manifest?.files?.['elway-rating-trends'])source.textContent=updatedLabel(manifest.published_at)||'Latest approved ELWAY ratings'}catch(_){}render()}catch(err){let cached='';try{cached=localStorage.getItem(CACHE_KEY+':data')||''}catch(_){}teams=makeTeams(parseCSV(cached||fallbackCSV));source.textContent=updatedLabel(FALLBACK_UPDATED)||'Latest approved ELWAY ratings';errorBox.textContent=cached?'Live feed unavailable; showing the most recently cached ratings.':'Live feed unavailable; showing the embedded approved ratings.';errorBox.classList.add('show');render();console.warn('ELWAY paths: using fallback data',err)}}
function resize(){if(window.parent===window)return;const h=Math.ceil(Math.max(root.scrollHeight,root.getBoundingClientRect().height));parent.postMessage({type:'substack-code-embed',source:'height',height:h},'*');parent.postMessage({type:'silver-bulletin:embed-height',height:h},'*')}
teams=makeTeams(parseCSV(fallbackCSV));initControls();render();refresh();new ResizeObserver(resize).observe(root);window.addEventListener('online',refresh);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});setInterval(()=>{if(!document.hidden)refresh()},300000);
})();
</script>
