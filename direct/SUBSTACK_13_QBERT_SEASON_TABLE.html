function warCell(v,max){const w=Math.max(0,Math.min(100,Math.abs(v)/max*100)),label=(config.kind==='season'&&v>=0?'+':'')+v.toFixed(1);return `<td class="war"><div class="bar-track"><span class="bar ${v<0?'negative':''}" style="width:${w}%"><span class="bar-label"${w<25?' style="left:3px;right:auto"':''}>${esc(label)}</span></span></div></td>`}
function render(){
 const filtered=rows.filter(r=>normalize(r.player+' '+(r.team||'')).includes(query)).sort((a,b)=>{const av=a[sortKey],bv=b[sortKey];if(av==null)return bv==null?0:1;if(bv==null)return -1;return (typeof av==='number'?av-bv:String(av).localeCompare(String(bv)))*sortDirection||a.rank-b.rank});
 const pages=Math.max(1,Math.ceil(filtered.length/pageSize));page=Math.min(page,pages-1);
 const maxWar=Math.max(1,...rows.map(r=>Math.abs(r.war||0)));
 root.querySelector('tbody').innerHTML=filtered.slice(page*pageSize,(page+1)*pageSize).map(r=>`<tr${r.player.includes('⛑')?' class="injured"':''}><td class="rank">${r.rank}</td>${playerCell(r)}${config.kind==='season'?teamCell(r.team)+heatCell(r.raw)+heatCell(r.adjusted)+`<td>${integer(r.plays)}</td>`+warCell(r.war,maxWar):config.kind==='lifetime'?`<td>${r.first}</td><td>${r.last}</td>`+heatCell(r.raw)+heatCell(r.adjusted)+`<td>${integer(r.plays)}</td>`+warCell(r.war,maxWar):`<td class="starter" aria-label="${r.starter?'Projected starter':'Not the projected starter'}">${r.starter?'✓':''}</td>`+teamCell(r.team)+heatCell(r.y2024)+heatCell(r.y2025)+heatCell(r.y2026)+heatCell(r.projection,'projection')}</tr>`).join('')||`<tr><td class="empty" colspan="${config.columns}">No quarterbacks match your search.</td></tr>`;
 root.querySelector('.page-label').textContent=`Page ${page+1} of ${pages}`;
 root.querySelector('.previous').disabled=page===0;root.querySelector('.next').disabled=page===pages-1;
 root.querySelectorAll('th[data-key]').forEach(th=>{th.setAttribute('aria-sort',th.dataset.key===sortKey?(sortDirection===1?'ascending':'descending'):'none');th.toggleAttribute('data-default',sortKey===config.sortKey&&sortDirection===-1)});
 resize();
}
function stamp(iso){const d=new Date(iso);if(!Number.isFinite(+d)||+d>Date.now()+60000)throw Error('Invalid data update time');const time=root.querySelector('time');time.dateTime=iso;time.textContent='Updated '+new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit',timeZoneName:'short'}).format(d);displayedAt=iso}
function resize(){requestAnimationFrame(()=>{const style=getComputedStyle(document.body),h=Math.ceil(root.getBoundingClientRect().height+parseFloat(style.paddingTop||0)+parseFloat(style.paddingBottom||0));parent.postMessage({type:'silver-bulletin:embed-height',height:h},'*');parent.postMessage({type:'substack-code-embed',source:'height',height:h},'*')})}
function parseCSV(text){const result=[];let row=[],value='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){value+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(value);value=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(value);if(row.some(v=>v!==''))result.push(row);row=[];value=''}else value+=c}if(value!==''||row.length){row.push(value);result.push(row)}if(quoted)throw Error('Malformed CSV');return result}
function sha256Portable(text){
  const bytes=new TextEncoder().encode(text),size=Math.ceil((bytes.length+9)/64)*64,padded=new Uint8Array(size),view=new DataView(padded.buffer);
  padded.set(bytes);padded[bytes.length]=0x80;view.setUint32(size-8,Math.floor(bytes.length/0x20000000));view.setUint32(size-4,(bytes.length*8)>>>0);
  const k=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  const h=new Uint32Array([0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19]),w=new Uint32Array(64),rotr=(n,b)=>(n>>>b)|(n<<(32-b));
  for(let offset=0;offset<size;offset+=64){
    for(let i=0;i<16;i++)w[i]=view.getUint32(offset+i*4);
    for(let i=16;i<64;i++){const x=w[i-15],y=w[i-2],s0=rotr(x,7)^rotr(x,18)^(x>>>3),s1=rotr(y,17)^rotr(y,19)^(y>>>10);w[i]=(w[i-16]+s0+w[i-7]+s1)>>>0}
    let [a,b,c,d,e,f,g,z]=h;
    for(let i=0;i<64;i++){const s1=rotr(e,6)^rotr(e,11)^rotr(e,25),ch=(e&f)^(~e&g),t1=(z+s1+ch+k[i]+w[i])>>>0,s0=rotr(a,2)^rotr(a,13)^rotr(a,22),maj=(a&b)^(a&c)^(b&c),t2=(s0+maj)>>>0;z=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b;b=a;a=(t1+t2)>>>0}
    const state=[a,b,c,d,e,f,g,z];for(let i=0;i<8;i++)h[i]=(h[i]+state[i])>>>0;
  }
  return [...h].map(v=>v.toString(16).padStart(8,'0')).join('');
}
async function sha256(text){if(!globalThis.crypto?.subtle)return sha256Portable(text);const digest=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(text));return [...new Uint8Array(digest)].map(v=>v.toString(16).padStart(2,'0')).join('')}

function apply(values,iso,status){const next=adapt(values);stamp(iso);rows=next;root.dataset.feedStatus=status;render()}
async function refresh(){
 try{
  const mres=await fetch(new URL('manifest.json?_='+Date.now(),sourceRoot),{cache:'no-store',credentials:'omit'});if(!mres.ok)throw Error('Manifest unavailable');const m=await mres.json(),entry=m.files?.[config.feed];
  if(m.schema!==1||!entry||entry.path!=='data/latest/'+config.feed+'.csv'||!/^[a-f0-9]{64}$/.test(entry.sha256))throw Error('Feed is not in the approved release');
  const iso=entry.updated_at||m.published_at;if(!Number.isFinite(Date.parse(iso))||Date.parse(iso)>Date.now()+60000)throw Error('Invalid update time');
  if(Date.parse(iso)<Date.parse(displayedAt))return;
  const response=await fetch(new URL(config.feed+'.csv?v='+entry.sha256,sourceRoot),{cache:'no-store',credentials:'omit'});if(!response.ok)throw Error('Approved data unavailable');const text=await response.text();
  if(await sha256(text)!==entry.sha256)throw Error('Approved data checksum mismatch');
  apply(parseCSV(text),iso,'approved');try{localStorage.setItem(cacheKey,JSON.stringify({text,sha256:entry.sha256,updated_at:iso}))}catch(_){}
 }catch(error){root.dataset.refreshStatus='retained-verified-data';console.info('QBERT table: retaining dated verified data.',error.message)}
}
root.querySelector('input').addEventListener('input',e=>{query=normalize(e.target.value.trim());page=0;render()});
root.querySelector('.previous').addEventListener('click',()=>{page--;render()});root.querySelector('.next').addEventListener('click',()=>{page++;render()});
root.querySelectorAll('th[data-key] button').forEach(button=>button.addEventListener('click',()=>{const key=button.closest('th').dataset.key;sortDirection=key===sortKey?-sortDirection:(key==='player'?1:-1);sortKey=key;page=0;render()}));
apply(snapshot.values,snapshot.updated_at,'bundled-verified');
(async()=>{try{const c=JSON.parse(localStorage.getItem(cacheKey)||'null');if(c&&Date.parse(c.updated_at)>Date.parse(displayedAt)&&await sha256(c.text)===c.sha256)apply(parseCSV(c.text),c.updated_at,'cached-verified')}catch(_){}await refresh()})();
setInterval(refresh,300000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});window.addEventListener('resize',resize);document.fonts?.ready.then(resize);
})();
</script>
